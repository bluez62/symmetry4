<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symmetry 4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Symmetry 4</h1>
    <p class="sub-heading">By Bluez62</p>
    
    <header id="controls">
        <div class="control-group">
            <button id="undoBtn" aria-label="Undo stroke" disabled>Undo</button>
            <button id="redoBtn" aria-label="Redo stroke" disabled>Redo</button>
            <div class="control-group">
                <label for="bgColorPicker">Canvas BG:</label>
                <input type="color" id="bgColorPicker" value="#1e1e1e" aria-label="Canvas background color picker">
            </div>
        </div>

        <div class="control-group">
            <label for="symmetryMode">Symmetry:</label>
            <select id="symmetryMode">
                <option value="4-corner">4-Corner Mirror</option>
                <option value="kaleidoscope">Kaleidoscope</option>
            </select>

            <div id="slicesContainer" style="display:none" class="inline-group">
                <label for="slicesPicker">Slices:</label>
                <input type="range" id="slicesPicker" min="4" max="32" step="2" value="12">
                <span id="slicesVal">12</span>
                <label><input type="checkbox" id="mirrorSlices" checked> Mirror Slices</label>
            </div>
        </div>

        <div class="control-group">
            <!-- Brush Style Selector -->
            <label for="brushType">Brush Style:</label>
            <select id="brushType">
                <option value="standard">Solid Line</option>
                <option value="spray">Dotted Spray</option>
                <option value="calligraphy">Neon Calligraphy</option>
                <option value="eraser">Eraser</option>
                <option value="marker">Highlighter / Marker</option>
                <option value="charcoal">Charcoal / Pencil</option>
            </select>

            <label for="colorMode">Color Mode:</label>
            <select id="colorMode">
                <option value="rainbow-click" selected>Random Color / Click</option>
                <option value="fixed">Fixed Color</option>
                <option value="rainbow-cycle">Continuous Rainbow</option>
            </select>
            <!-- Disabled by default since Random Color is active -->
            <input type="color" id="colorPicker" value="#00ffcc" aria-label="Brush color picker" disabled>

            <div id="paletteContainer" class="palette-presets">
                <span class="palette-swatch" data-color="#ff3366" style="background-color: #ff3366;"></span>
                <span class="palette-swatch" data-color="#00ffcc" style="background-color: #00ffcc;"></span>
                <span class="palette-swatch" data-color="#ffcc00" style="background-color: #ffcc00;"></span>
                <span class="palette-swatch" data-color="#9933ff" style="background-color: #9933ff;"></span>
                <span class="palette-swatch" data-color="#ffffff" style="background-color: #ffffff;"></span>
            </div>
        </div>


        <div class="control-group">
            <label><input type="checkbox" id="neonGlow" checked> Neon Glow</label>
            <label><input type="checkbox" id="showGuides" checked> Guidelines</label>
        </div>

        <div class="control-group">
            <label for="sizePicker">Size:</label>
            <input type="range" id="sizePicker" min="1" max="25" value="4">
            
            <label for="opacityPicker">Opacity:</label>
            <input type="range" id="opacityPicker" min="10" max="100" value="100">
        </div>

        <div class="control-group">
            <label>Origin:</label>
            <button id="toggleMoveCenterBtn" aria-label="Toggle change center mode">Set Center</button>
            <button id="resetOriginBtn" style="padding: 2px 8px; font-size: 0.75rem;">Reset Center</button>
        </div>


        <div class="control-group">
            <button id="clearBtn">Clear</button>
            <button id="downloadBtn" class="primary-btn">Download Image</button>
        </div>
    </header>

    <main class="canvas-wrapper">
        <canvas id="drawCanvas" width="600" height="600"></canvas>
        <canvas id="guideCanvas" width="600" height="600"></canvas>
    </main>

    <footer id="tipBar">
        <span class="tip-icon"></span> 
        <span id="tipText">Pro-Tip: Hold <kbd>Shift</kbd> and click anywhere on the canvas to relocate the symmetry center!</span>
    </footer>

    <script src="script.js"></script>
</body>
</html>
