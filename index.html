<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uhh... Symmetrical Drawing Thing!</title>
    <style>
        body {
            margin: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin: 5px 0;
            font-size: 1.2rem;
        }

        #controls {
            margin-bottom: 10px;
            display: flex;
            gap: 15px;
            align-items: center;
            background: #252525;
            padding: 10px 15px;
            border-radius: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        canvas {
            background-color: #1e1e1e;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            cursor: crosshair;
            border-radius: 4px;
        }

        button {
            background-color: #444;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #666;
        }

        #downloadBtn {
            background-color: #00aa66;
        }

        #downloadBtn:hover {
            background-color: #00cc77;
        }

        input[disabled] {
            opacity: 0.3;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h1>symmetrical drawing thing!!</h1>
    <div id="controls">
        <div class="control-group">
            <label><input type="checkbox" id="randomMode" checked> Random Color Each Click</label>
        </div>
        <div class="control-group">
            <label>Fixed Color: <input type="color" id="colorPicker" value="#00ffcc" disabled></label>
        </div>
        <div class="control-group">
            <label>Size: <input type="range" id="sizePicker" min="1" max="20" value="4"></label>
        </div>
        <button id="clearBtn">Clear Canvas</button>
        <button id="downloadBtn">Download Image</button>
    </div>

    <canvas id="drawCanvas" width="600" height="600"></canvas>

    <script>
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        const randomMode = document.getElementById('randomMode');
        const colorPicker = document.getElementById('colorPicker');
        const sizePicker = document.getElementById('sizePicker');
        const clearBtn = document.getElementById('clearBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let currentStrokeColor = '#00ffcc';

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        randomMode.addEventListener('change', () => {
            colorPicker.disabled = randomMode.checked;
        });

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        clearBtn.addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        downloadBtn.addEventListener('click', () => {
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = canvas.width;
            exportCanvas.height = canvas.height;
            const exportCtx = exportCanvas.getContext('2d');

            exportCtx.fillStyle = '#1e1e1e';
            exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

            exportCtx.drawImage(canvas, 0, 0);

            const imageURI = exportCanvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = 'symmetry-artwork.png';
            link.href = imageURI;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        function getRandomColor() {
            const hue = Math.floor(Math.random() * 360);
            return `hsl(${hue}, 100%, 60%)`;
        }

        function startDrawing(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            lastX = e.clientX - rect.left;
            lastY = e.clientY - rect.top;

            if (randomMode.checked) {
                currentStrokeColor = getRandomColor();
            } else {
                currentStrokeColor = colorPicker.value;
            }
        }

        function draw(e) {
            if (!isDrawing) return;

            const rect = canvas.getBoundingClientRect();
            const currentX = e.clientX - rect.left;
            const currentY = e.clientY - rect.top;

            ctx.strokeStyle = currentStrokeColor;
            ctx.lineWidth = sizePicker.value;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            drawLine(lastX, lastY, currentX, currentY);

            const refX1 = centerX + (centerX - lastX);
            const curX1 = centerX + (centerX - currentX);
            drawLine(refX1, lastY, curX1, currentY);

            const refY2 = centerY + (centerY - lastY);
            const curY2 = centerY + (centerY - currentY);
            drawLine(lastX, refY2, currentX, curY2);

            drawLine(refX1, refY2, curX1, curY2);

            lastX = currentX;
            lastY = currentY;
        }

        function drawLine(x1, y1, x2, y2) {
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
        }

        function stopDrawing() {
            isDrawing = false;
        }
    </script>
</body>
</html>
