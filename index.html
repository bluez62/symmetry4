<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Bluez Symmetry Drawing Thing</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Ultimate Bluez Symmetry Drawing Thing</h1>
    <div id="controls">
        <div class="control-group"> <button id="undoBtn" disabled>Undo</button> <button id="redoBtn"
                disabled>Redo</button> </div>
        <div class="control-group"> <label>Symmetry: <select id="symmetryMode">
                    <option value="4-corner">4-Corner Mirror</option>
                    <option value="kaleidoscope">Kaleidoscope</option>
                </select> </label> <label id="slicesContainer" style="display:none">Slices: <input type="range"
                    id="slicesPicker" min="4" max="32" step="2" value="12"> <span id="slicesVal">12</span> </label>
        </div>
        <div class="control-group"> <label>Brush: <select id="brushType">
                    <option value="rainbow-click">Random Color / Click</option>
                    <option value="rainbow-cycle">Continuous Rainbow</option>
                    <option value="fixed">Fixed Color</option>
                </select> </label> <input type="color" id="colorPicker" value="#00ffcc" disabled> </div>
        <div class="control-group"> <label><input type="checkbox" id="neonGlow" checked> Neon Glow</label> <label><input
                    type="checkbox" id="showGuides" checked> Guidelines</label> </div>
        <div class="control-group"> <label>Size: <input type="range" id="sizePicker" min="1" max="25" value="4"></label>
            <label>Opacity: <input type="range" id="opacityPicker" min="10" max="100" value="100"></label>
        </div>
        <div class="control-group"> <button id="clearBtn">Clear</button> <button id="downloadBtn">Download
                Image</button> </div>
    </div>
    <div
        style="position:relative;width:600px;height:600px;background-color:#1e1e1e;box-shadow:0 0 25px rgba(0,0,0,.9);border-radius:6px">
        <canvas id="drawCanvas" width="600" height="600" style="position:absolute;left:0;top:0;z-index:1"></canvas>
        <canvas id="guideCanvas" width="600" height="600"
            style="position:absolute;left:0;top:0;z-index:2;cursor:crosshair"></canvas>
    </div>
        <script src="script.js"></script>
</body>

</html>
