<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluez Symmetry Thing!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Bluez Symmetry Thing!</h1>
    
    <header id="controls">
        <div class="control-group">
            <button id="undoBtn" aria-label="Undo stroke" disabled>Undo</button>
            <button id="redoBtn" aria-label="Redo stroke" disabled>Redo</button>
        </div>

        <div class="control-group">
            <label for="symmetryMode">Symmetry:</label>
            <select id="symmetryMode">
                <option value="4-corner">4-Corner Mirror</option>
                <option value="kaleidoscope">Kaleidoscope</option>
            </select>

            <div id="slicesContainer" style="display:none" class="inline-group">
                <label for="slicesPicker">Slices:</label>
                <input type="range" id="slicesPicker" min="4" max="32" step="2" value="12">
                <span id="slicesVal">12</span>
            </div>
        </div>

        <div class="control-group">
            <label for="brushType">Brush:</label>
            <select id="brushType">
                <option value="rainbow-click">Random Color / Click</option>
                <option value="rainbow-cycle">Continuous Rainbow</option>
                <option value="fixed">Fixed Color</option>
            </select>
            <input type="color" id="colorPicker" value="#00ffcc" aria-label="Brush color picker" disabled>
        </div>

        <div class="control-group">
            <label><input type="checkbox" id="neonGlow" checked> Neon Glow</label>
            <label><input type="checkbox" id="showGuides" checked> Guidelines</label>
        </div>

        <div class="control-group">
            <label for="sizePicker">Size:</label>
            <input type="range" id="sizePicker" min="1" max="25" value="4">
            
            <label for="opacityPicker">Opacity:</label>
            <input type="range" id="opacityPicker" min="10" max="100" value="100">
        </div>

        <div class="control-group">
            <button id="clearBtn">Clear</button>
            <button id="downloadBtn" class="primary-btn">Download Image</button>
        </div>
    </header>

    <main class="canvas-wrapper">
        <canvas id="drawCanvas" width="600" height="600"></canvas>
        <canvas id="guideCanvas" width="600" height="600"></canvas>
    </main>

    <script src="script.js"></script>
</body>
</html>
