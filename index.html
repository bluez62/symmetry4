<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ultimate Bluez Symmetry Drawing Thing</title><style>body{margin:0;background-color:#121212;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden}h1{margin:5px 0;font-size:1.4rem}#controls{margin-bottom:12px;display:flex;gap:15px;align-items:center;background:#252525;padding:12px 20px;border-radius:8px;flex-wrap:wrap;justify-content:center}.control-group{display:flex;align-items:center;gap:8px;border-right:1px solid #444;padding-right:15px}.control-group:last-child{border-right:none;padding-right:0}canvas{background-color:transparent;border-radius:6px}button{background-color:#444;color:#fff;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;font-weight:700}button:hover{background-color:#666}button:disabled{opacity:.3}#downloadBtn{background-color:#00aa66}#downloadBtn:hover{background-color:#00cc77}input[disabled],select[disabled]{opacity:.3}label{font-size:.9rem;display:flex;align-items:center;gap:5px}</style></head><body> <h1>Ultimate Bluez Symmetry Drawing Thing</h1> <div id="controls"> <div class="control-group"> <button id="undoBtn" disabled>Undo</button> <button id="redoBtn" disabled>Redo</button> </div> <div class="control-group"> <label>Symmetry: <select id="symmetryMode"> <option value="kaleidoscope">Kaleidoscope</option> <option value="4-corner">4-Corner Mirror</option> </select> </label> <label id="slicesContainer" style="display:none">Slices: <input type="range" id="slicesPicker" min="4" max="32" step="2" value="12"> <span id="slicesVal">12</span> </label> </div> <div class="control-group"> <label>Brush: <select id="brushType"> <option value="rainbow-click">Random Color / Click</option> <option value="rainbow-cycle">Continuous Rainbow</option> <option value="fixed">Fixed Color</option> </select> </label> <input type="color" id="colorPicker" value="#00ffcc" disabled> </div> <div class="control-group"> <label><input type="checkbox" id="neonGlow" checked> Neon Glow</label> <label><input type="checkbox" id="showGuides" checked> Guidelines</label> </div> <div class="control-group"> <label>Size: <input type="range" id="sizePicker" min="1" max="25" value="4"></label> <label>Opacity: <input type="range" id="opacityPicker" min="10" max="100" value="100"></label> </div> <div class="control-group"> <button id="clearBtn">Clear</button> <button id="downloadBtn">Download Image</button> </div> </div> <div style="position:relative;width:600px;height:600px;background-color:#1e1e1e;box-shadow:0 0 25px rgba(0,0,0,.9);border-radius:6px"> <canvas id="drawCanvas" width="600" height="600" style="position:absolute;left:0;top:0;z-index:1"></canvas> <canvas id="guideCanvas" width="600" height="600" style="position:absolute;left:0;top:0;z-index:2;cursor:crosshair"></canvas> </div> <script>const canvas=document.getElementById('drawCanvas'),ctx=canvas.getContext('2d'),guideCanvas=document.getElementById('guideCanvas'),gCtx=guideCanvas.getContext('2d'),symmetryMode=document.getElementById('symmetryMode'),slicesContainer=document.getElementById('slicesContainer'),slicesPicker=document.getElementById('slicesPicker'),slicesVal=document.getElementById('slicesVal'),brushType=document.getElementById('brushType'),colorPicker=document.getElementById('colorPicker'),neonGlow=document.getElementById('neonGlow'),showGuides=document.getElementById('showGuides'),sizePicker=document.getElementById('sizePicker'),opacityPicker=document.getElementById('opacityPicker'),undoBtn=document.getElementById('undoBtn'),redoBtn=document.getElementById('redoBtn'),clearBtn=document.getElementById('clearBtn'),downloadBtn=document.getElementById('downloadBtn');let isDrawing=!1,lastX=0,lastY=0,currentStrokeColor='#00ffcc',rainbowHue=0;const centerX=canvas.width/2,centerY=canvas.height/2;let undoStack=[],redoStack=[];const MAX_STATES=20;saveState();symmetryMode.addEventListener('change',()=>{slicesContainer.style.display='kaleidoscope'===symmetryMode.value?'flex':'none';drawGuidelines()});slicesPicker.addEventListener('input',()=>{slicesVal.textContent=slicesPicker.value;drawGuidelines()});showGuides.addEventListener('change',drawGuidelines);brushType.addEventListener('change',()=>{colorPicker.disabled='fixed'!==brushType.value});guideCanvas.addEventListener('mousedown',startDrawing);guideCanvas.addEventListener('mousemove',draw);window.addEventListener('mouseup',stopDrawing);clearBtn.addEventListener('click',()=>{ctx.clearRect(0,0,canvas.width,canvas.height);saveState()});undoBtn.addEventListener('click',undo);redoBtn.addEventListener('click',redo);drawGuidelines();function startDrawing(e){isDrawing=!0;const t=guideCanvas.getBoundingClientRect();lastX=e.clientX-t.left;lastY=e.clientY-t.top;if('rainbow-click'===brushType.value){currentStrokeColor=`hsl(${Math.floor(360*Math.random())}, 100%, 60%)`}else if('fixed'===brushType.value){currentStrokeColor=colorPicker.value}}function draw(e){if(!isDrawing)return;const t=guideCanvas.getBoundingClientRect(),n=e.clientX-t.left,o=e.clientY-t.top;if('rainbow-cycle'===brushType.value){rainbowHue=(rainbowHue+2)%360;currentStrokeColor=`hsl(${rainbowHue}, 100%, 60%)`}ctx.globalAlpha=opacityPicker.value/100;ctx.strokeStyle=currentStrokeColor;ctx.lineWidth=sizePicker.value;ctx.lineCap='round';ctx.lineJoin='round';if(neonGlow.checked){ctx.shadowBlur=1.5*sizePicker.value;ctx.shadowColor=currentStrokeColor}else{ctx.shadowBlur=0}if('4-corner'===symmetryMode.value){drawFourCorners(lastX,lastY,n,o)}else{drawKaleidoscope(lastX,lastY,n,o)}lastX=n;lastY=o}function stopDrawing(){if(isDrawing){isDrawing=!1;saveState()}}function drawLine(e,t,n,o){ctx.beginPath();ctx.moveTo(e,t);ctx.lineTo(n,o);ctx.stroke()}function drawFourCorners(e,t,n,o){drawLine(e,t,n,o);drawLine(centerX+(centerX-e),t,centerX+(centerX-n),o);drawLine(e,centerY+(centerY-t),n,centerY+(centerY-o));drawLine(centerX+(centerX-e),centerY+(centerY-t),centerX+(centerX-n),centerY+(centerY-o))}function drawKaleidoscope(e,t,n,o){const r=parseInt(slicesPicker.value),a=2*Math.PI/r,i=e-centerX,c=t-centerY,s=n-centerX,l=o-centerY;for(let e=0;e<r;e++){ctx.save();ctx.translate(centerX,centerY);ctx.rotate(a*e);ctx.beginPath();ctx.moveTo(i,c);ctx.lineTo(s,l);ctx.stroke();ctx.scale(1,-1);ctx.beginPath();ctx.moveTo(i,c);ctx.lineTo(s,l);ctx.stroke();ctx.restore()}}function drawGuidelines(){gCtx.clearRect(0,0,guideCanvas.width,guideCanvas.height);if(!showGuides.checked)return;gCtx.strokeStyle='rgba(255, 255, 255, 0.15)';gCtx.lineWidth=1;if('4-corner'===symmetryMode.value){gCtx.beginPath();gCtx.moveTo(centerX,0);gCtx.lineTo(centerX,canvas.height);gCtx.moveTo(0,centerY);gCtx.lineTo(canvas.width,centerY);gCtx.stroke()}else{const e=parseInt(slicesPicker.value);for(let t=0;t<e/2;t++){const n=2*Math.PI/e*t;gCtx.beginPath();gCtx.moveTo(centerX+450*Math.cos(n),centerY+450*Math.sin(n));gCtx.lineTo(centerX-450*Math.cos(n),centerY-450*Math.sin(n));gCtx.stroke()}}}function saveState(){if(undoStack.length>=MAX_STATES)undoStack.shift();undoStack.push(canvas.toDataURL());redoStack=[];updateHistoryButtons()}function undo(){if(!(undoStack.length<=1)){redoStack.push(undoStack.pop());loadState(undoStack[undoStack.length-1])}}function redo(){if(0!==redoStack.length){const e=redoStack.pop();undoStack.push(e);loadState(e)}}function loadState(e){const t=new Image;t.src=e;t.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.drawImage(t,0,0);updateHistoryButtons()}}function updateHistoryButtons(){undoBtn.disabled=undoStack.length<=1;redoBtn.disabled=0===redoStack.length}downloadBtn.addEventListener('click',()=>{const e=document.createElement('canvas');e.width=canvas.width;e.height=canvas.height;const t=e.getContext('2d');t.fillStyle='#1e1e1e';t.fillRect(0,0,e.width,e.height);t.drawImage(canvas,0,0);const n=document.createElement('a');n.download='ultimate-symmetry-artwork.png';n.href=e.toDataURL('image/png');n.click()});</script></body></html>
